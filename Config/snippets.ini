; ============================================================
; TextExpander snippets — edit freely, no code changes needed.
;   [name]         section = snippet name
;   trigger=;text  the hotstring (type it and press Space/Enter/Tab)
;   expansion=...  the text; placeholders: {date} {time} {iso} {branch}
;                  {clipboard} {cursor} {uuid} {username}
;                  multi-line: use \n for newline and \t for tab
;   mode=raw       type out character-by-character (plain ASCII)
;   mode=clipboard paste via clipboard (multi-line / Unicode) — clipboard is
;                  saved and restored, and excluded from clipboard history
;   mode=script    call a built-in scripted snippet (gitpush/pr/commit)
; ============================================================

[gitpush]
trigger=;gitpush
expansion=git push origin {branch}
mode=clipboard

[pr]
trigger=;pr
expansion=## Summary\n\n## Changes\n- \n\n## Test plan\n- {cursor}
mode=clipboard

[shrug]
trigger=;shrug
expansion=¯\_(ツ)_/¯
mode=clipboard

[date]
trigger=;date
expansion={date}
mode=raw

[iso]
trigger=;iso
expansion={iso}
mode=raw

[uuid]
trigger=;uuid
expansion={uuid}
mode=clipboard

[commit]
trigger=;commit
expansion=feat: {cursor}
mode=clipboard

[thankyou]
trigger=;ty
expansion=Thank you!
mode=raw
