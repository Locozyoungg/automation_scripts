; ============================================================
; Exclusion lists (comma-separated under each section's "items" key).
; ============================================================

[clipboard_exclude]
; Apps whose clipboard changes ClipboardManager must NEVER record.
items=Bitwarden.exe,1Password.exe,KeePass.exe,keepassxc.exe,LastPass.exe

[usb_allow_serials]
; Trusted USB device serial numbers (skip USBGuard prompts).
items=

[secrets_allow]
; SecretsScanner allow-list: fingerprint prefixes shown in SecretsReport.html.
items=

[browser_allow_domains]
; Domains BrowserAutomation may touch (CDP actions are refused elsewhere).
items=github.com,gitlab.com,atlassian.net,localhost,127.0.0.1

[focus_allow]
; Apps FocusMode must never disturb (pipe-separated exe names).
items=
