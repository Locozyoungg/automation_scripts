; ============================================================
; WindowManager layouts.
;   [default] rules=ide,browser,terminal   (comma-separated rule names)
;   [rule.X] match_exe   = pipe-separated exe names (no .exe; case-insensitive)
;            match_class = optional window class substring
;            match_title = optional title substring/regex
;            monitor     = 1..N (absent monitors fall back to the primary)
;            action      = left | right | max | full | tl | tr | bl | br
; Save current arrangement: Win+Numpad1    Restore: Win+Numpad0
; Snap: Win+Alt+Left/Right/Up/Down   Move to next monitor: Win+Alt+M
; ============================================================

[default]
rules=ide,browser,terminal

[rule.ide]
match_exe=code.exe
match_title=Visual Studio Code
monitor=1
action=left

[rule.browser]
match_exe=chrome.exe|msedge.exe|brave.exe
monitor=2
action=max

[rule.terminal]
match_exe=WindowsTerminal.exe
monitor=1
action=br
